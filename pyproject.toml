[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-ai-automation-lab"
version = "0.1.0"
description = "Synthetic logistics process analysis and offline AI triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
logistics-lab = "logistics_lab.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.report]
precision = 2
