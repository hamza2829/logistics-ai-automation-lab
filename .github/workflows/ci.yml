name: Logistics Automation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n:
    name: n8n webhook and approval
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install .
      - name: Run imported n8n workflow against FastAPI
        run: bash scripts/n8n-smoke.sh artifacts/n8n
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: n8n-run
          path: artifacts/n8n/n8n-run.log
          if-no-files-found: ignore
